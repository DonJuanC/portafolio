<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <rect width="1200" height="680" fill="#14120e"/>

  <!-- Store Nav -->
  <rect x="40" y="30" width="1120" height="60" rx="8" fill="#1b1914" stroke="#2c2921" stroke-width="1.5"/>
  <text x="70" y="67" fill="#e5a93d" font-family="monospace" font-size="20" font-weight="bold">Geekeame</text>
  <text x="190" y="67" fill="#9b9583" font-family="monospace" font-size="13">tienda geek · pines, stickers y tazas</text>
  <rect x="990" y="45" width="140" height="32" rx="6" fill="#2c2921"/>
  <text x="1008" y="66" fill="#e5a93d" font-family="monospace" font-size="12">Carrito: 3 ítems</text>

  <!-- Product 1 -->
  <rect x="40" y="115" width="350" height="490" rx="8" fill="#1b1914" stroke="#2c2921" stroke-width="1.5"/>
  <rect x="65" y="140" width="300" height="230" rx="6" fill="#14120e" stroke="#2c2921"/>
  <text x="150" y="250" fill="#e5a93d" font-family="monospace" font-size="36" font-weight="bold">[ PIN ]</text>
  <text x="135" y="285" fill="#9b9583" font-family="monospace" font-size="12">AWS S3 presigned URL</text>
  <text x="65" y="405" fill="#e9e4d4" font-family="monospace" font-size="18" font-weight="bold">Pin «127.0.0.1 Home»</text>
  <text x="65" y="435" fill="#9b9583" font-family="monospace" font-size="13">Esmalte metálico negro · 3.5cm</text>
  <text x="65" y="475" fill="#e5a93d" font-family="monospace" font-size="20" font-weight="bold">$ 18.000 COP</text>
  <rect x="65" y="515" width="300" height="42" rx="6" fill="#24211a" stroke="#e5a93d"/>
  <text x="145" y="541" fill="#e5a93d" font-family="monospace" font-size="13">Agregar al carrito</text>

  <!-- Product 2 -->
  <rect x="425" y="115" width="350" height="490" rx="8" fill="#1b1914" stroke="#2c2921" stroke-width="1.5"/>
  <rect x="450" y="140" width="300" height="230" rx="6" fill="#14120e" stroke="#2c2921"/>
  <text x="535" y="250" fill="#e5a93d" font-family="monospace" font-size="36" font-weight="bold">[ MUG ]</text>
  <text x="520" y="285" fill="#9b9583" font-family="monospace" font-size="12">AWS S3 presigned URL</text>
  <text x="450" y="405" fill="#e9e4d4" font-family="monospace" font-size="18" font-weight="bold">Taza «404 Coffee Not Found»</text>
  <text x="450" y="435" fill="#9b9583" font-family="monospace" font-size="13">Cerámica mate 11oz</text>
  <text x="450" y="475" fill="#e5a93d" font-family="monospace" font-size="20" font-weight="bold">$ 32.000 COP</text>
  <rect x="450" y="515" width="300" height="42" rx="6" fill="#24211a" stroke="#e5a93d"/>
  <text x="530" y="541" fill="#e5a93d" font-family="monospace" font-size="13">Agregar al carrito</text>

  <!-- Right Order Transaction Flow Info -->
  <rect x="810" y="115" width="350" height="490" rx="8" fill="#1b1914" stroke="#2c2921" stroke-width="1.5"/>
  <text x="835" y="155" fill="#e5a93d" font-family="monospace" font-size="14" font-weight="bold">TRANSACCIÓN EN CHECKOUT</text>
  
  <rect x="835" y="180" width="300" height="385" rx="6" fill="#14120e" stroke="#2c2921"/>
  <text x="855" y="215" fill="#9b9583" font-family="monospace" font-size="12">Firestore Transaction Lock:</text>
  <text x="855" y="245" fill="#e9e4d4" font-family="monospace" font-size="13">1. Leer catálogo y stock actual</text>
  <text x="855" y="275" fill="#e9e4d4" font-family="monospace" font-size="13">2. Validar disponibilidad global</text>
  <text x="855" y="305" fill="#e9e4d4" font-family="monospace" font-size="13">3. Descontar stock atómicamente</text>
  <text x="855" y="335" fill="#e9e4d4" font-family="monospace" font-size="13">4. Generar orden 'pendiente'</text>
  
  <line x1="855" y1="365" x2="1115" y2="365" stroke="#2c2921"/>
  <text x="855" y="395" fill="#27c93f" font-family="monospace" font-size="12">✓ Cero sobreventas por compras</text>
  <text x="855" y="415" fill="#27c93f" font-family="monospace" font-size="12">  simultáneas en 20s de timeout</text>

  <rect x="855" y="475" width="260" height="48" rx="6" fill="#e5a93d"/>
  <text x="915" y="505" fill="#14120e" font-family="monospace" font-size="13" font-weight="bold">Checkout Seguro</text>
</svg>
