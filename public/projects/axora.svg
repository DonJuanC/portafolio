  <text x="795" y="360" fill="#e9e4d4" font-family="monospace" font-size="12">• Crédito: +461.70 EUR (comisión 0.3%)</text>
  <text x="795" y="392" fill="#9b9583" font-family="monospace" font-size="11">Esperando confirmación...</text>

  <rect x="780" y="440" width="170" height="44" rx="6" fill="#e5a93d"/>
  <text x="815" y="467" fill="#14120e" font-family="monospace" font-size="13" font-weight="bold">Confirmar cambio</text>

  <rect x="965" y="440" width="175" height="44" rx="6" fill="#24211a" stroke="#2c2921"/>
