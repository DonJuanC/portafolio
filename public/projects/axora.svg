  <text x="590" y="531" fill="#27c93f" font-family="monospace" font-size="14" font-weight="bold">+1,200.00 USD</text>

  <!-- Row 3 -->
  <line x1="70" y1="562" x2="710" y2="562" stroke="#2c2921" stroke-width="1"/>
