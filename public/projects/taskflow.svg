<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <rect width="1200" height="680" fill="#14120e"/>

  <!-- Top bar -->
  <rect x="40" y="30" width="1120" height="60" rx="8" fill="#1b1914" stroke="#2c2921" stroke-width="1.5"/>
  <text x="70" y="67" fill="#e5a93d" font-family="monospace" font-size="20" font-weight="bold">TaskFlow</text>
  <text x="180" y="67" fill="#9b9583" font-family="monospace" font-size="13">tablero kanban con drag &amp; drop (dnd-kit) + AWS SES email digest</text>

  <!-- Column 1: Por Hacer -->
  <rect x="40" y="115" width="350" height="515" rx="8" fill="#1b1914" stroke="#2c2921" stroke-width="1.5"/>
  <text x="65" y="150" fill="#9b9583" font-family="monospace" font-size="13" font-weight="bold">POR HACER (2)</text>
  
  <rect x="60" y="175" width="310" height="110" rx="6" fill="#14120e" stroke="#2c2921"/>
  <text x="80" y="205" fill="#e9e4d4" font-family="monospace" font-size="14" font-weight="bold">Diseñar esquema de base de datos</text>
  <text x="80" y="230" fill="#9b9583" font-family="monospace" font-size="11">Prioridad: Alta · Vence: hoy</text>
  <rect x="80" y="248" width="60" height="20" rx="4" fill="#3a1e1e"/>
  <text x="90" y="262" fill="#ff7b72" font-family="monospace" font-size="10">Urgente</text>

  <rect x="60" y="305" width="310" height="110" rx="6" fill="#14120e" stroke="#2c2921"/>
  <text x="80" y="335" fill="#e9e4d4" font-family="monospace" font-size="14" font-weight="bold">Configurar alertas en AWS SES</text>
  <text x="80" y="360" fill="#9b9583" font-family="monospace" font-size="11">Serverless mail trigger</text>

  <!-- Column 2: En Proceso (Active Drag) -->
  <rect x="425" y="115" width="350" height="515" rx="8" fill="#1b1914" stroke="#2c2921" stroke-width="1.5"/>
  <text x="450" y="150" fill="#e5a93d" font-family="monospace" font-size="13" font-weight="bold">EN PROGRESO (1)</text>

  <!-- Dragging Card -->
  <rect x="445" y="175" width="310" height="120" rx="6" fill="#24211a" stroke="#e5a93d" stroke-width="1.5"/>
  <text x="465" y="205" fill="#e9e4d4" font-family="monospace" font-size="14" font-weight="bold">Migrar auth a Firebase</text>
  <text x="465" y="230" fill="#9b9583" font-family="monospace" font-size="11">Google OAuth + email password</text>
  <text x="465" y="265" fill="#e5a93d" font-family="monospace" font-size="11">✋ Arrastrando con dnd-kit...</text>

  <!-- Column 3: Completado -->
  <rect x="810" y="115" width="350" height="515" rx="8" fill="#1b1914" stroke="#2c2921" stroke-width="1.5"/>
  <text x="835" y="150" fill="#27c93f" font-family="monospace" font-size="13" font-weight="bold">COMPLETADO (4)</text>

  <rect x="830" y="175" width="310" height="90" rx="6" fill="#14120e" stroke="#2c2921"/>
  <text x="850" y="205" fill="#9b9583" font-family="monospace" font-size="14">Configuración inicial Vite + React 19</text>
  <text x="850" y="230" fill="#27c93f" font-family="monospace" font-size="11">✓ Verificado con Vitest</text>

  <rect x="830" y="280" width="310" height="90" rx="6" fill="#14120e" stroke="#2c2921"/>
  <text x="850" y="310" fill="#9b9583" font-family="monospace" font-size="14">Persistencia reactiva en Firestore</text>
  <text x="850" y="335" fill="#27c93f" font-family="monospace" font-size="11">✓ Sincronización en tiempo real</text>
</svg>
